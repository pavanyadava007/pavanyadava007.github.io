name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      # Numeric integrity: every metric rendered on the site must still match the
      # snapshot of the source it was copied from. This is the gate that matters most.
      - name: Verify metrics against the source snapshot
        run: npm run verify:metrics

      - name: Build
        run: npm run build

      - name: Check the initial JS budget on /
        run: node scripts/check-budgets.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright and axe
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse CI
        run: npx @lhci/cli autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
